<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الشخصية | حمد النزار</title>
    <style>
        /* إعدادات الألوان الأساسية */
        :root {
            --bg-color: #0f172a; /* لون الخلفية */
            --card-bg: #1e293b; /* لون بطاقة المعلومات */
            --text-main: #f8fafc; /* لون النص الأساسي */
            --text-muted: #94a3b8; /* لون النص الثانوي */
            --accent: #3b82f6; /* لون الأزرار والتفاصيل */
        }

        /* تنسيق الصفحة بالكامل */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* تنسيق بطاقة الملف الشخصي */
        .profile-card {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 380px;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* تنسيق الصورة الشخصية */
        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: var(--accent);
            margin: 0 auto 15px;
            border: 3px solid var(--accent);
            object-fit: cover;
            display: block;
        }

        /* تنسيق النصوص */
        h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
        }

        p.title {
            color: var(--accent);
            font-weight: 600;
            font-size: 15px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        p.bio {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        /* تنسيق الروابط (الأزرار) */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .links a {
            text-decoration: none;
            color: var(--text-main);
            background-color: rgba(255,255,255,0.03);
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .links a:hover, .links a:active {
            background-color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* تنسيق حقوق البرمجة (الفوتر) */
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .footer span {
            color: var(--accent);
            font-weight: bold;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- ضع رابط صورتك الشخصية بدل الرابط الموجود في src -->
        <img src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" alt="صورة حمد النزار" class="profile-pic">
        
        <h1>حمد النزار</h1>
        <p class="title">مطور تطبيقات ومواقع ويب</p>
        
        <p class="bio">
            أهلاً بك في صفحتي الشخصية. أهتم ببرمجة وتطوير الواجهات وتطبيقات الويب، وأسعى لتقديم تجربة مستخدم سريعة، خفيفة، ومبتكرة.
        </p>

        <!-- روابط التواصل أو الأعمال -->
        <div class="links">
            <a href="#">🌐 موقعي الشخصي</a>
            <a href="#">📱 حسابي على تيليجرام</a>
            <a href="#">💼 مشاريعي وأعمالي</a>
        </div>

        <!-- حقوق البرمجة -->
        <div class="footer">
            برمجة <span>حمد النزار</span> 💻
        </div>
    </div>

</body>
</html>
