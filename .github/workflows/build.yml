name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Web to APK
        run: |
          npm install -g nativefier
          nativefier --name "MyProfileApp" "my-projec/index.html" --platform android
